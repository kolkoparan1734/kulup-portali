{% extends "auth.html" %}

{% block title %}Giriş{% endblock %}

{% block content %}
<h1 class="giris-baslik">Yetkili Girişi</h1>
<p class="giris-aciklama">Bu panel yalnızca Öğrenci Dekanlığı yetkilileri içindir.</p>

{% if hata %}<div class="bildirim bildirim-hata" role="alert">{{ hata }}</div>{% endif %}

<form method="POST" class="form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label class="alan">
        <span>Kullanıcı adı</span>
        <input type="text" name="kullanici_adi" autocomplete="username" required autofocus>
    </label>
    <label class="alan">
        <span>Şifre</span>
        <input type="password" name="sifre" autocomplete="current-password" required>
    </label>
    <button type="submit" class="dugme dugme-ana dugme-tam">Giriş Yap</button>
</form>

<p class="giris-alt"><a href="{{ url_for('sifremi_unuttum') }}">Şifremi unuttum</a></p>
{% endblock %}
