{% extends "base.html" %}

{% block title %}Zorunlu Evrakı Düzenle{% endblock %}

{% block content %}
<a href="{{ url_for('zorunlu_evraklar', donem_id=donem.id) }}" class="geri-link">&larr; Zorunlu Evraklar · {{ donem.ad }}</a>

<div class="sayfa-baslik">
    <h1>Zorunlu Evrakı Düzenle</h1>
</div>

{% if hata %}<div class="bildirim bildirim-hata" role="alert">{{ hata }}</div>{% endif %}

<form method="POST" class="form kutu">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="form-izgara">
        <label class="alan">
            <span>Belge türü *</span>
            <select name="tur" required>
                {% for tur in belge_turleri %}<option {% if tur == evrak.tur %}selected{% endif %}>{{ tur }}</option>{% endfor %}
            </select>
        </label>
        <label class="alan">
            <span>Son teslim tarihi *</span>
            <input type="date" name="teslim_tarihi" value="{{ evrak.teslim_tarihi }}" required>
        </label>
        <label class="alan alan-genis">
            <span>Açıklama</span>
            <input type="text" name="aciklama" value="{{ evrak.aciklama }}" maxlength="200">
        </label>
    </div>
    <div class="form-eylemler">
        <a href="{{ url_for('zorunlu_evraklar', donem_id=donem.id) }}" class="dugme">Vazgeç</a>
        <button type="submit" class="dugme dugme-ana">Kaydet</button>
    </div>
</form>
{% endblock %}
